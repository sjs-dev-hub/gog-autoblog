<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174d35">
{%- if site.google_site_verification -%}
<meta name="google-site-verification" content="{{ site.google_site_verification | escape }}">
{%- endif -%}
{%- seo -%}
{%- assign share_image = page.image.path | default: page.image | default: '/assets/social/guild-guide-share.png' -%}
<meta property="og:image" content="{{ share_image | absolute_url }}">
<meta property="og:image:secure_url" content="{{ share_image | absolute_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1824">
<meta property="og:image:height" content="911">
<meta property="og:image:alt" content="{{ page.image.alt | default: 'Guild of Golf equipment guide' | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ share_image | absolute_url }}">
<link rel="icon" href="{{ '/assets/guild-of-golf-shield.svg' | relative_url }}?v=20260827-gg-shield-1" type="image/svg+xml">
<link rel="shortcut icon" href="{{ '/assets/guild-of-golf-shield.svg' | relative_url }}?v=20260827-gg-shield-1" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{%- assign asset_version = site.time | date: '%s' -%}
<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ asset_version }}">
<script src="{{ '/assets/site.js' | relative_url }}?v={{ asset_version }}" defer></script>
{%- if site.google_analytics -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  window.gtag = gtag;
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics | escape }}');
</script>
{%- endif -%}
