# _config.yml
title: Guild of Golf Gear Guides
description: Practical golf equipment guidance, fitting context, and honest tradeoffs to help you make better decisions for your game.

# Default rich-link artwork for Messages, social networks, and other link previews.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/social/guild-guide-share.png
        width: 1824
        height: 911
        alt: Golf equipment arranged for a thoughtful club-fitting and buying decision.

twitter:
  card: summary_large_image

# Theme
theme: minima

# Plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

# Traffic measurement. These values are public site identifiers, never API keys.
# Add them after creating the corresponding Google properties.
google_analytics:
google_site_verification:

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Make sure Markdown allows raw/block HTML (needed for Amazon widget <script> blocks)
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true      # <-- keeps multi-line <script> and other block HTML
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

# (Optional but recommended) set site URL for proper canonical links/RSS
url: "https://deals.guildofgolf.com"
baseurl: ""
