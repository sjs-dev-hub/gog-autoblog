name: Rewrite One Legacy Article

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm i

      - name: Run editorial and migration tests
        run: node --test scripts/prototype/quality.test.js scripts/measurement.test.js scripts/migration/queue.test.js

      - name: Rewrite the newest eligible legacy article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          OPENAI_IMAGE_MODEL: "gpt-image-2"
          REWRITE_MAX_ATTEMPTS: "2"
        run: node scripts/migration/rewrite.js --next --publish --image

      - name: Validate Jekyll build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Commit one validated archive rewrite
        run: |
          set -e
          git config user.name "gog-editorial-bot"
          git config user.email "bot@users.noreply.github.com"
          git add _posts/*.md assets/generated/articles/*.webp || true
          git diff --cached --quiet && exit 0
          CHANGED_POSTS=$(git diff --cached --name-only -- '_posts/*.md' | wc -l)
          test "$CHANGED_POSTS" -eq 1
          git commit -m "Rewrite one legacy article"
          git pull --rebase origin main
          git push origin main
