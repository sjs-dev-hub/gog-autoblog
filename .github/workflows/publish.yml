name: Publish Daily Post

on:
  schedule:
    - cron: "0 7 * * *"   # runs every day at 07:00 UTC
  workflow_dispatch: {}    # optional: trigger daily manually

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm i

      - name: Run quality tests
        run: node --test scripts/prototype/quality.test.js

      - name: Generate evidence-backed article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          OPENAI_IMAGE_MODEL: "gpt-image-2"
          GENERATE_ARTICLE_IMAGE: "1"
        run: node scripts/content/daily.js

      - name: Validate Jekyll build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Commit & Push
        run: |
          set -e
          git config user.name "gog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add _posts/*.md assets/generated/articles/*.webp || true
          git commit -m "Auto post $(date -u +'%Y-%m-%d')" || echo "No changes"
          git pull --rebase origin main
          git push origin main
